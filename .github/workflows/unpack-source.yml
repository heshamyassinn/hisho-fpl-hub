name: Repair app source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild exact app.js
        run: |
          test -f .appupload/chunk_08.b64 || exit 0
          cat .appupload/chunk_*.b64 > /tmp/app.b64
          base64 -d /tmp/app.b64 > public/app.js
          echo "fbe1b91450514ebdc328cf87173886cbca1f9a2d77f65718365645052059a48d  public/app.js" | sha256sum -c -
          rm -rf .appupload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair exact Hisho FPL Hub app source"
          git push
