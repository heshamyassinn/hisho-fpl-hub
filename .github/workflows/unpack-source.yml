name: Unpack source package

on:
  push:
    branches: [main]
    paths: [source-package.zip]

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack application source
        run: |
          unzip -o source-package.zip -d .
          rm source-package.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Hisho FPL Hub v5.1 iOS PWA source"
          git push
