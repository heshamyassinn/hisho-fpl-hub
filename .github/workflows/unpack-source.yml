name: Unpack source package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and unpack application source
        run: |
          test -f .upload/chunk_04.b64 || exit 0
          cat .upload/chunk_*.b64 > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source-package.zip
          unzip -o /tmp/source-package.zip -d . || true
          rm -rf .upload source-package.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Hisho FPL Hub v5.1 iOS PWA source" || exit 0
          git push
