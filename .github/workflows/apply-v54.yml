name: Apply v5.4 mobile and transfers
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/apply_v54.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html server.js
          git diff --cached --quiet && exit 0
          git commit -m "Ship v5.4 iPhone layout, theme toggle and streamed transfers"
          git push
