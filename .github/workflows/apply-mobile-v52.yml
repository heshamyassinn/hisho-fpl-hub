name: Apply mobile v5.2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link mobile override
        run: |
          grep -q 'mobile-v52.css' public/styles.css || printf '\n@import url("/mobile-v52.css");\n' >> public/styles.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/styles.css
          git commit -m "Apply iPhone mobile UX redesign" || exit 0
          git push
