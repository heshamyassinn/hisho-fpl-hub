name: Link mobile CSS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  link:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add mobile stylesheet link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text()
          tag='  <link rel="stylesheet" href="/mobile-v52.css?v=52" />\n'
          if 'mobile-v52.css' not in s:
              s=s.replace('</head>', tag+'</head>')
              p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Load iPhone mobile stylesheet" || exit 0
          git push
