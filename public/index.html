<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#071410" />
  <meta name="description" content="Hisho FPL Hub — professional Fantasy Premier League intelligence, transfer planning, league leverage, projections and player news." />
  <meta name="application-name" content="Hisho FPL Hub" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Hisho FPL Hub" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />

  <title>Hisho FPL Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="/mobile-v52.css?v=53" />
</head>
<body>
  <div class="ambient a"></div><div class="ambient b"></div><div class="ambient c"></div><div class="noise"></div>
  <div class="app-shell">
    <aside class="sidebar glass">
      <div class="brand">
        <div class="brand-mark">H</div>
        <div><b>Hisho FPL Hub</b><span>Fantasy Intelligence OS</span></div>
      </div>
      <nav>
        <button class="nav active" data-view="dashboard"><span>⌂</span><b>Dashboard</b></button>
        <button class="nav" data-view="planner"><span>✦</span><b>Transfer Planner</b></button>
        <button class="nav" data-view="squad"><span>◈</span><b>My Squad</b></button>
        <button class="nav" data-view="players"><span>⌕</span><b>Player Lab</b></button>
        <button class="nav" data-view="compare"><span>⇄</span><b>Compare</b><em id="compareCount">0</em></button>
        <button class="nav" data-view="leagues"><span>◎</span><b>League Intelligence</b></button>
        <button class="nav" data-view="fixtures"><span>▦</span><b>Fixture Difficulty</b></button>
        <button class="nav" data-view="simulator"><span>◫</span><b>GW Simulator</b></button>
        <button class="nav" data-view="news"><span>◉</span><b>News Room</b></button>
        <button class="nav" data-view="transfers"><span>↗</span><b>Transfers</b></button>
        <button class="nav" data-view="history"><span>◷</span><b>GW History</b></button>
      </nav>
      <div class="source-health">
        <span id="understatDot"></span><div><b>Data status</b><small id="understatHealth">Official FPL + advanced loading</small></div>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div><span class="eyebrow">HISHO FPL HUB</span><h1 id="pageTitle">Command Center</h1></div>
        <div class="top-actions">
          <button class="secondary ios-install" id="installBtn">Add to Home Screen</button>
          <button class="icon-btn" id="refreshBtn" title="Refresh">↻</button>
          <button class="secondary" id="accountBtn">Account</button>
          <button class="primary" id="connectBtn">Connect FPL <b>→</b></button>
        </div>
      </header>

      <!-- Main application content below is rendered/controlled by app.js -->
      <section class="view active" id="dashboard"></section>
      <section class="view" id="planner"></section>
      <section class="view" id="squad"></section>
      <section class="view" id="players"></section>
      <section class="view" id="compare"></section>
      <section class="view" id="leagues"></section>
      <section class="view" id="fixtures"></section>
      <section class="view" id="simulator"></section>
      <section class="view" id="news"></section>
      <section class="view" id="transfers"></section>
      <section class="view" id="history"></section>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <div id="compareTray" class="compare-tray"></div>

  <dialog id="connectDialog"><form method="dialog" id="connectForm"><h3>Connect FPL</h3><p>Enter your public FPL Entry ID.</p><input id="entryIdInput" inputmode="numeric" placeholder="FPL Entry ID"/><div class="dialog-actions"><button value="cancel" class="secondary">Cancel</button><button value="default" class="primary" id="connectSubmit">Connect</button></div></form></dialog>
  <dialog id="accountDialog"><div id="accountDialogBody"></div></dialog>
  <dialog id="playerDialog"><div id="playerDialogBody"></div></dialog>

  <script src="app.js"></script>
</body>
</html>
